services:
  # -------------------------------------------------------------
  # OmniForge Backend Service (FastAPI + WebSockets + SQLite)
  # -------------------------------------------------------------
  - type: web
    name: omniforge-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
    autoDeploy: true

  # -------------------------------------------------------------
  # OmniForge Frontend Service (Next.js Mission Control)
  # -------------------------------------------------------------
  - type: web
    name: omniforge-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: omniforge-backend
          property: host
      - key: NEXT_PUBLIC_WS_URL
        fromService:
          type: web
          name: omniforge-backend
          property: host
    autoDeploy: true
